# 话题分类树：大类 → 子话题 → 体裁
#
# 字段说明：
#   id        类别标识（入库 category 字段、SupplyPlanner 权重键、grounding_categories 均使用 id）
#   zh / en   类别的中英文名称（用于构造提示词）
#   weight    类别目标权重（> 0，按全部类别归一化）
#   grounding 是否启用 Google Search grounding；只允许 daily_news / daily_economy / sports_events 为 true
#   genres    可选，该类别允许的体裁子集（缺省 = 说明文、评论、教程、案例分析、摘要、对话）
#             8 种体裁：说明文、评论、教程、案例分析、摘要、对话、书评/影评、新闻综述
#   subtopics 10–30 个子话题，每项给出 zh 与 en 名称
#
# 内容约束：排除政治、宗教、暴力、色情、违法活动、医疗诊断、投资建议与争议性话题。
# 人物传记只述公认史实；学术论文中的医学内容仅限科普层面；经济类只做数据与动态综述。

